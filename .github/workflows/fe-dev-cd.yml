name: Frontend Dev CD v2 (ASG Instance Refresh)

# CI 성공 후 develop 브랜치에서만 트리거
on:
  workflow_run:
    workflows: ["Frontend CI v2 (Docker + ECR)"]
    types: [completed]
    branches: [develop]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ASG_NAME: billage-dev-v2-fe-asg

# ============================================================
# 배포 흐름:
# 1. CI에서 ECR에 latest 이미지 Push 완료
#    - NEXT_PUBLIC_*는 빌드 시점에 이미 JS 번들에 포함됨
# 2. 이 워크플로우가 ASG Instance Refresh 트리거
# 3. ASG가 새 EC2 부팅 → user_data 실행
#    - ECR에서 billage-fe:latest Pull
#    - SSM /billage/dev/fe/* 에서 서버사이드 환경변수 조회
#      (NEXTAUTH_SECRET, NEXTAUTH_URL 등)
#    - docker run -e 로 서버사이드 환경변수 주입
# 4. ALB Health Check (/) 통과 → 기존 EC2 종료
# ============================================================

jobs:
  deploy:
    name: Deploy to Dev (Instance Refresh)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discord - Deploy Started
        run: |
          curl -H "Content-Type: application/json" -X POST \
            -d '{"embeds": [{"title": "🚀 [DEV] Frontend 배포 시작", "color": 3447003, "fields": [{"name": "Commit", "value": "`${{ github.event.workflow_run.head_sha }}`", "inline": true}]}]}' \
            ${{ secrets.DISCORD_WEBHOOK }} || true

      # ASG Instance Refresh 트리거
      # MinHealthyPercentage: 0 → Dev는 인스턴스 1대라서 기존 종료 후 새로 띄움 (다운타임 발생)
      - name: Trigger ASG Instance Refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage": 0}' \
            --query "InstanceRefreshId" \
            --output text)

          echo "refresh_id=${REFRESH_ID}" >> $GITHUB_OUTPUT
          echo "🔄 Instance Refresh Started: ${REFRESH_ID}"

      # Instance Refresh 완료 대기
      - name: Wait for Instance Refresh
        timeout-minutes: 10
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ env.ASG_NAME }} \
              --instance-refresh-ids ${REFRESH_ID} \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PROGRESS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ env.ASG_NAME }} \
              --instance-refresh-ids ${REFRESH_ID} \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "📊 Status: ${STATUS}, Progress: ${PROGRESS}%"

            case $STATUS in
              "Successful")
                echo "✅ Instance Refresh completed successfully!"
                exit 0
                ;;
              "Failed"|"Cancelled"|"RollbackSuccessful"|"RollbackFailed")
                echo "❌ Instance Refresh failed with status: ${STATUS}"
                exit 1
                ;;
              *)
                sleep 30
                ;;
            esac
          done

      - name: Discord - Deploy Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" -X POST \
            -d '{"embeds": [{"title": "✅ [DEV] Frontend 배포 완료", "color": 65280, "fields": [{"name": "Commit", "value": "`${{ github.event.workflow_run.head_sha }}`", "inline": true}, {"name": "ASG", "value": "`${{ env.ASG_NAME }}`", "inline": true}]}]}' \
            ${{ secrets.DISCORD_WEBHOOK }} || true

      - name: Discord - Deploy Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -X POST \
            -d '{"content": "@here", "embeds": [{"title": "❌ [DEV] Frontend 배포 실패", "color": 16711680, "fields": [{"name": "Commit", "value": "`${{ github.event.workflow_run.head_sha }}`", "inline": true}, {"name": "Refresh ID", "value": "`${{ steps.refresh.outputs.refresh_id }}`", "inline": true}]}]}' \
            ${{ secrets.DISCORD_WEBHOOK }} || true

      - name: Cancel Instance Refresh on Failure
        if: failure()
        continue-on-error: true
        run: |
          aws autoscaling cancel-instance-refresh \
            --auto-scaling-group-name ${{ env.ASG_NAME }} || true
          echo "🔙 Instance Refresh cancelled"
