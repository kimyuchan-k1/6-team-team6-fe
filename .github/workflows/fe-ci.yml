name: Frontend CI v2 (Docker + ECR)

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - 'context/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - 'context/**'

permissions:
  id-token: write # OIDC 토큰 발급에 필요
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: billage-fe

jobs:
  # ============================================================
  # Job 1: 코드 품질 검사
  # ============================================================
  check:
    name: Type Check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

  # ============================================================
  # Job 2: Docker 빌드 & ECR Push
  # - NEXT_PUBLIC_*: 빌드 시점에 --build-arg로 주입 (GitHub Secrets)
  # - NEXTAUTH_* 등 서버변수: 런타임에 SSM Parameter Store에서 주입
  # ============================================================
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS OIDC 인증
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 환경별 빌드 인자 설정 (NEXT_PUBLIC_*는 빌드 시점에 주입 필요)
      - name: Set Build Args
        id: build-args
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            PREFIX="PROD"
          else
            PREFIX="DEV"
          fi
          echo "prefix=${PREFIX}" >> $GITHUB_OUTPUT

      # Docker Buildx 설정 (캐시 활용)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker 빌드 & Push
      # - latest: user_data에서 Pull용
      # - sha: 롤백/추적용
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        env:
          PREFIX: ${{ steps.build-args.outputs.prefix }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.ref == 'refs/heads/main' && secrets.PROD_NEXT_PUBLIC_API_URL || secrets.DEV_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_IMAGE_HOSTNAME=${{ github.ref == 'refs/heads/main' && secrets.PROD_NEXT_PUBLIC_IMAGE_HOSTNAME || secrets.DEV_NEXT_PUBLIC_IMAGE_HOSTNAME }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ github.ref == 'refs/heads/main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_API_KEY || secrets.DEV_NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ github.ref == 'refs/heads/main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.DEV_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ github.ref == 'refs/heads/main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_PROJECT_ID || secrets.DEV_NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ github.ref == 'refs/heads/main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.DEV_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ github.ref == 'refs/heads/main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.DEV_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ github.ref == 'refs/heads/main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_APP_ID || secrets.DEV_NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ github.ref == 'refs/heads/main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || secrets.DEV_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ github.ref == 'refs/heads/main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_VAPID_KEY || secrets.DEV_NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Output Image Info
        run: |
          echo "✅ Pushed: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          echo "✅ Pushed: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

      # 이미지 취약점 스캔 (비동기, 실패해도 진행)
      - name: Trigger ECR Scan
        continue-on-error: true
        run: |
          aws ecr start-image-scan \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-id imageTag=${{ github.sha }}

  # ============================================================
  # Job 3: 빌드 성공 알림
  # ============================================================
  notify-success:
    name: Notify Build Success
    runs-on: ubuntu-latest
    needs: [check, build-and-push]
    if: success()

    steps:
      - name: Send Discord Notification
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "✅ Frontend CI 성공",
                   "color": 65280,
                   "fields": [
                     {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                     {"name": "Image Tag", "value": "`${{ github.sha }}`", "inline": true},
                     {"name": "Author", "value": "${{ github.actor }}", "inline": true}
                   ]
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK }} || true

  # ============================================================
  # Job 4: 빌드 실패 알림
  # ============================================================
  notify-failure:
    name: Notify Build Failure
    runs-on: ubuntu-latest
    needs: [check, build-and-push]
    if: failure()

    steps:
      - name: Send Discord Notification
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "content": "@here",
                 "embeds": [{
                   "title": "❌ Frontend CI 실패",
                   "color": 16711680,
                   "fields": [
                     {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                     {"name": "Commit", "value": "`${{ github.sha }}`", "inline": true},
                     {"name": "Author", "value": "${{ github.actor }}", "inline": true}
                   ]
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK }} || true
